name: Terminal build

on:
  pull_request:
    paths:
      - 'terminal/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/terminal-build.yml'
  push:
    branches:
      - main
      - 'fix/mobile-chart-context-menu-2026-11-25'
    paths:
      - 'terminal/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/terminal-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build terminal
        run: npm run build
